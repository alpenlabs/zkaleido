[advisories]
ignore = [
  # RUSTSEC-2023-0071 (rsa 0.9.8)
  # Pulled in via risc0 / rzup.
  # No fixed upgrade available as of now.
  # Revisit when risc0 updates its crypto dependencies.
  "RUSTSEC-2023-0071",

  # RUSTSEC-2025-0055 (tracing-subscriber 0.2.25)
  # Pulled in via ark-relations.
  # Upgrade blocked until upstream bumps tracing-subscriber >= 0.3.20.
  # Low risk: affects ANSI escape sequences in logs only.
  "RUSTSEC-2025-0055",

  # RUSTSEC-2026-0344 (ruzstd 0.7.3, 0.8.3)
  # Pulled in via object 0.36 (risc0-zkvm) and object 0.37 (sp1).
  # Upgrade blocked until upstream moves to an object release that uses ruzstd >= 0.9.1.
  # Low risk: only reached when parsing compressed sections of our own guest and host binaries.
  "RUSTSEC-2026-0344",

  # RUSTSEC-2026-0367, RUSTSEC-2026-0368, RUSTSEC-2026-0369 (zip 2.4.2)
  # Pulled in via risc0-circuit-recursion (risc0-zkvm).
  # Upgrade blocked until risc0 moves to zip >= 9.0.0 (risc0 main still requires zip 2.1).
  # Low risk: all three affect extracting archives to disk; risc0 only reads its embedded,
  # hash-pinned zkr archive in memory and never calls `extract()`.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",

  # RUSTSEC-2026-0387 (crypto-bigint 0.5.5)
  # Pulled in via k256 0.13 (our native adapter, sp1, and alloy in sp1-sdk).
  # The fix is only in crypto-bigint >= 0.7.6, which needs k256 0.14.
  # Upgrade blocked until alloy moves to k256 0.14 (alloy-signer 2.5.0 still requires 0.13).
  # Risk: timing leaks on secret scalars. Secret keys only reach it when the native adapter
  # signs public values and when sp1-sdk signs prover network requests.
  "RUSTSEC-2026-0387",
]
